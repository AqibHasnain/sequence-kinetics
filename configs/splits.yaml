# Single source of truth for the chromosome hold-out of genes and variants.
#
# `validation`, `test` and `train` define the primary split, used for gene-level metrics.
# `cv_folds` define the 5-fold chromosome cross-validation used for variant routing: every
# variant is scored by the fold model whose training chromosomes exclude the variant's
# chromosome. Folds were balanced by gene count and fixed before any training.
validation: [chr7]
test: [chr2, chr8, chr13]
train: [chr1, chr3, chr4, chr5, chr6, chr9, chr10, chr11, chr12, chr14, chr15, chr16, chr17,
        chr18, chr19, chr20, chr21, chr22]
excluded: [chrX, chrY, chrM]
cv_folds:
  fold0: [chr1, chr5, chr8, chr18]
  fold1: [chr7, chr10, chr13, chr19, chr22]
  fold2: [chr4, chr11, chr12, chr15]
  fold3: [chr2, chr6, chr9, chr14]
  fold4: [chr3, chr16, chr17, chr20, chr21]
