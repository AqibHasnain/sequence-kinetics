[project]
name = "sk"
version = "0.1.0"
description = "Which measurements make regulatory variant effects identifiable as synthesis, processing or decay?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "requests>=2.32",
    "pyfaidx>=0.8",
    "openpyxl>=3.1",
    "pyliftover>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-xdist>=3.6", "ruff>=0.6"]
nuts = ["numpyro>=0.15", "jax>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
